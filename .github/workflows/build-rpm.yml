name: Build Postfix Custom Mailserver RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Build inside Amazon Linux 2023 for maximum compatibility
    # with the target Amazon Linux environment.
    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    steps:
      - name: Install build tools
        run: |
          dnf -y update
          dnf -y install \
            rpm-build \
            rpmdevtools \
            systemd-rpm-macros \
            tar \
            gzip \
            findutils \
            sed \
            git \
            bash

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repository as safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Derive RPM version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow is intended to build releases from tags."
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"

          # v2.1.0 -> 2.1.0
          VERSION="${TAG#v}"

          # Basic RPM version validation.
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid RPM version: $VERSION"
            echo "Expected tag format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Git tag:     $TAG"
          echo "RPM version: $VERSION"

      - name: Show repository contents
        run: |
          echo "Repository:"
          find . -maxdepth 3 -type f -print | sort

      - name: Validate source files
        run: |
          set -e

          test -f "SPECS/postfix-custom-mailserver.spec"

          test -f "SOURCES/mailserver-configure.sh"
          test -f "SOURCES/generate-dkim-key.sh"
          test -f "SOURCES/add-alias.sh"
          test -f "SOURCES/mailserver-validate.sh"

          echo "All required packaging files are present."

      - name: Validate shell scripts
        run: |
          set -e

          for script in \
            SOURCES/mailserver-configure.sh \
            SOURCES/generate-dkim-key.sh \
            SOURCES/add-alias.sh \
            SOURCES/mailserver-validate.sh
          do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Setup rpmbuild tree
        run: |
          rpmdev-setuptree

      - name: Create source tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"

          SOURCE_ROOT="postfix-custom-mailserver-${VERSION}"
          SOURCE_TARBALL="$HOME/rpmbuild/SOURCES/${SOURCE_ROOT}.tar.gz"

          echo "Creating:"
          echo "  $SOURCE_TARBALL"
          echo "with root directory:"
          echo "  $SOURCE_ROOT/"

          tar \
            --exclude-vcs \
            --exclude="./dist" \
            --exclude="./.github" \
            -czf "$SOURCE_TARBALL" \
            --transform="s|^.|${SOURCE_ROOT}|" \
            -C . .

          echo
          echo "Tarball contents:"
          tar -tzf "$SOURCE_TARBALL" | head -100

      - name: Prepare SPEC file
        run: |
          VERSION="${{ steps.ver.outputs.version }}"

          cp \
            SPECS/postfix-custom-mailserver.spec \
            "$HOME/rpmbuild/SPECS/"

          SPEC="$HOME/rpmbuild/SPECS/postfix-custom-mailserver.spec"

          # Set the version from the Git tag.
          sed -i \
            "s|^Version:.*|Version:        ${VERSION}|" \
            "$SPEC"

          # Source archive generated by this workflow.
          sed -i \
            's|^Source0:.*|Source0:        postfix-custom-mailserver-%{version}.tar.gz|' \
            "$SPEC"

          echo "Prepared SPEC:"
          cat "$SPEC"

      - name: Validate SPEC metadata
        run: |
          SPEC="$HOME/rpmbuild/SPECS/postfix-custom-mailserver.spec"

          echo "Checking RPM metadata..."

          rpm --eval '%{_target_cpu}'
          rpm --eval '%{_target_os}'
          rpm --eval '%{_target_vendor}'

          grep -E '^(Name|Version|Release|Summary|License|URL|Source0|BuildArch):' "$SPEC"

      - name: Build RPM
        run: |
          SPEC="$HOME/rpmbuild/SPECS/postfix-custom-mailserver.spec"

          rpmbuild -ba "$SPEC"

      - name: Verify RPM
        run: |
          set -e

          echo "Binary RPMs:"
          find "$HOME/rpmbuild/RPMS" \
            -type f \
            -name "*.rpm" \
            -print

          echo
          echo "Source RPMs:"
          find "$HOME/rpmbuild/SRPMS" \
            -type f \
            -name "*.src.rpm" \
            -print

          echo
          echo "RPM metadata:"
          for rpm in "$HOME"/rpmbuild/RPMS/*/*.rpm; do
            echo
            echo "========================================"
            echo "$rpm"
            echo "========================================"
            rpm -qip "$rpm"
          done

      - name: Collect RPMs
        run: |
          set -e

          mkdir -p dist/rpms
          mkdir -p dist/srpms

          find "$HOME/rpmbuild/RPMS" \
            -type f \
            -name "*.rpm" \
            -exec cp -v {} dist/rpms/ \;

          find "$HOME/rpmbuild/SRPMS" \
            -type f \
            -name "*.src.rpm" \
            -exec cp -v {} dist/srpms/ \;

          echo
          echo "Collected artifacts:"
          find dist -type f -print

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postfix-custom-mailserver-rpms-${{ steps.ver.outputs.version }}
          path: |
            dist/rpms/*.rpm
            dist/srpms/*.src.rpm
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            dist/rpms/*.rpm
            dist/srpms/*.src.rpm
          generate_release_notes: true
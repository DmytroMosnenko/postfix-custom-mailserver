name: Build Postfix Custom Mailserver RPM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Build on the same RPM-family platform as the primary target.
    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    steps:
      - name: Install build tools
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            rpm-build \
            rpmdevtools \
            systemd-rpm-macros \
            tar \
            gzip \
            findutils \
            sed \
            git \
            bash

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repository as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Derive RPM version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "This workflow must be run from a Git tag."
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Require a conventional RPM-compatible numeric version.
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Expected: vMAJOR.MINOR.PATCH (for example v2.1.0)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building RPM version: $VERSION"

      - name: Setup rpmbuild tree
        run: rpmdev-setuptree

      - name: Validate repository layout
        run: |
          set -euo pipefail

          required=(
            SPECS/postfix-custom-mailserver.spec
            SOURCES/mailserver-configure.sh
            SOURCES/generate-dkim-key.sh
            SOURCES/add-alias.sh
            SOURCES/mailserver-validate.sh
            README.md
            LICENSE
          )

          for path in "${required[@]}"; do
            if [[ ! -f "$path" ]]; then
              echo "Missing required file: $path" >&2
              exit 1
            fi
          done

      - name: Validate shell scripts
        run: |
          set -euo pipefail

          for script in SOURCES/*.sh; do
            echo "Checking $script"
            bash -n "$script"
          done

      - name: Create source tarball
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          ROOT="postfix-custom-mailserver-${VERSION}"
          TARBALL="$HOME/rpmbuild/SOURCES/${ROOT}.tar.gz"

          mkdir -p "$ROOT/SOURCES"
          cp SOURCES/*.sh "$ROOT/SOURCES/"
          cp README.md LICENSE "$ROOT/"

          tar -czf "$TARBALL" "$ROOT"
          rm -rf "$ROOT"

          echo "Created source archive: $TARBALL"
          tar -tzf "$TARBALL"

      - name: Prepare SPEC
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          SPEC="$HOME/rpmbuild/SPECS/postfix-custom-mailserver.spec"

          cp SPECS/postfix-custom-mailserver.spec "$SPEC"

          # The repository keeps a neutral placeholder version. The Git tag is
          # the authoritative release version.
          sed -i "s/^Version:[[:space:]]*.*/Version:        ${VERSION}/" "$SPEC"

          echo "Prepared SPEC:"
          cat "$SPEC"

      - name: Validate SPEC metadata
        run: |
          set -euo pipefail

          SPEC="$HOME/rpmbuild/SPECS/postfix-custom-mailserver.spec"
          VERSION="${{ steps.version.outputs.version }}"

          rpmspec --parse "$SPEC" >/dev/null

          grep -Eq "^Version:[[:space:]]+${VERSION}$" "$SPEC"
          grep -Eq '^Source0:[[:space:]]+postfix-custom-mailserver-%\{version\}\.tar\.gz$' "$SPEC"
          grep -q '^%setup -q -n %{name}-%{version}$' "$SPEC"

          echo "SPEC metadata and source layout are consistent."

      - name: Build RPM and SRPM
        run: |
          set -euo pipefail

          SPEC="$HOME/rpmbuild/SPECS/postfix-custom-mailserver.spec"
          rpmbuild -ba "$SPEC"

      - name: Verify built packages
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          RPM="$HOME/rpmbuild/RPMS/noarch/postfix-custom-mailserver-${VERSION}-1.*.noarch.rpm"
          SRPM="$HOME/rpmbuild/SRPMS/postfix-custom-mailserver-${VERSION}-1.src.rpm"

          compgen -G "$RPM" >/dev/null
          test -f "$SRPM"

          RPM_FILE=$(compgen -G "$RPM" | head -n1)

          echo "Binary RPM: $RPM_FILE"
          rpm -qip "$RPM_FILE"
          echo
          echo "RPM contents:"
          rpm -qlp "$RPM_FILE"
          echo
          echo "SRPM: $SRPM"
          rpm -qip "$SRPM"

      - name: Collect release files
        run: |
          set -euo pipefail

          mkdir -p dist
          find "$HOME/rpmbuild/RPMS" -type f -name '*.rpm' -exec cp -v {} dist/ \;
          find "$HOME/rpmbuild/SRPMS" -type f -name '*.src.rpm' -exec cp -v {} dist/ \;

          echo "Release files:"
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postfix-custom-mailserver-rpms-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true

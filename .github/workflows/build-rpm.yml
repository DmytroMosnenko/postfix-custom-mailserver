name: Build RPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "RPM version (e.g. 3.0.1) — overrides tag"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Build in Amazon Linux 2023 container for maximal compatibility with
    # both target platforms (AL2023 and AlmaLinux share the same RPM ABI).
    container:
      image: public.ecr.aws/amazonlinux/amazonlinux:2023

    steps:
      - name: Install build tools
        run: |
          dnf -y update
          dnf -y install \
            rpm-build \
            rpmdevtools \
            systemd-rpm-macros \
            tar \
            gzip \
            git \
            bash \
            findutils

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repo safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "ERROR: run from a vX.Y.Z tag or supply a version via workflow_dispatch"
            exit 1
          fi

          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]] || {
            echo "ERROR: invalid version '$VERSION' — must be digits and dots"
            exit 1
          }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RPM version: $VERSION"

      - name: Validate source files
        run: |
          set -e
          echo "Checking required files..."
          for f in \
            SPECS/postfix-custom-mailserver.spec \
            SOURCES/mailserver-configure.sh \
            SOURCES/generate-dkim-key.sh \
            SOURCES/add-alias.sh \
            SOURCES/mailserver-validate.sh \
            SOURCES/mailserver-preinstall-check.sh \
            README.md
          do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
            echo "  OK: $f"
          done

      - name: Syntax-check shell scripts
        run: |
          set -e
          for script in SOURCES/*.sh; do
            echo "bash -n $script"
            bash -n "$script"
          done
          echo "All scripts pass syntax check."

      - name: Setup rpmbuild tree
        run: rpmdev-setuptree

      - name: Create source tarball
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ROOT="postfix-custom-mailserver-${VERSION}"
          TARBALL="$HOME/rpmbuild/SOURCES/${ROOT}.tar.gz"

          tar \
            --exclude-vcs \
            --exclude='.github' \
            --exclude='dist' \
            -czf "$TARBALL" \
            --transform="s|^|${ROOT}/|" \
            SPECS/ SOURCES/ README.md LICENSE

          echo "Tarball contents:"
          tar -tzf "$TARBALL"

      - name: Prepare SPEC file
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          cp SPECS/postfix-custom-mailserver.spec "$HOME/rpmbuild/SPECS/"
          SPEC="$HOME/rpmbuild/SPECS/postfix-custom-mailserver.spec"
          sed -i "s|^Version:.*|Version:        ${VERSION}|" "$SPEC"
          sed -i "s|^Source0:.*|Source0:        postfix-custom-mailserver-${VERSION}.tar.gz|" "$SPEC"
          echo "Prepared SPEC:"
          cat "$SPEC"

      - name: Build RPM
        run: |
          SPEC="$HOME/rpmbuild/SPECS/postfix-custom-mailserver.spec"
          rpmbuild -ba "$SPEC"

      - name: Inspect RPM
        run: |
          echo "=== Binary RPMs ==="
          find "$HOME/rpmbuild/RPMS" -name "*.rpm" -print

          echo ""
          echo "=== RPM metadata ==="
          for rpm in "$HOME"/rpmbuild/RPMS/*/*.rpm; do
            echo "---"
            rpm -qip "$rpm"
            echo ""
            echo "File list:"
            rpm -qlp "$rpm"
          done

          echo ""
          echo "=== Source RPMs ==="
          find "$HOME/rpmbuild/SRPMS" -name "*.src.rpm" -print

      - name: Collect artifacts
        run: |
          mkdir -p dist/rpms dist/srpms
          find "$HOME/rpmbuild/RPMS"  -name "*.rpm"     -exec cp -v {} dist/rpms/ \;
          find "$HOME/rpmbuild/SRPMS" -name "*.src.rpm" -exec cp -v {} dist/srpms/ \;
          echo "Artifacts:"
          find dist -type f

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postfix-custom-mailserver-rpms-${{ steps.ver.outputs.version }}
          path: |
            dist/rpms/*.rpm
            dist/srpms/*.src.rpm
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/rpms/*.rpm
            dist/srpms/*.src.rpm
